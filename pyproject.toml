[project]
name = "smartcart"
version = "0.0.0"
description = "SmartCart monorepo root (uv workspace)"
requires-python = ">=3.12"
dependencies = ["smartcart-ingest", "smartcart-dashboard"]

[tool.uv.workspace]
members = ["services/ingest", "services/dashboard"]

[tool.uv]
package = false

[tool.uv.sources]
smartcart-ingest = { workspace = true }
smartcart-dashboard = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/ingest", "services/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["services/ingest/tests", "services/dashboard/tests"]
addopts = "-ra"
markers = [
  "postgis: needs the postgis extension (run in CI against supabase/postgres)",
  "pgvector: needs the vector extension (run in CI against supabase/postgres)",
  "db: needs a Postgres database",
]
