[project]
name = "smartcart-catalog"
version = "0.1.0"
description = "SmartCart canonical catalog: taxonomy, normalization, attribute extraction, embeddings, matching"
requires-python = ">=3.12"
dependencies = [
  "smartcart-ingest",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "typer>=0.12,<1",
  "structlog>=24.4,<25",
  "pyyaml>=6.0,<7",
  "anthropic>=1.11,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch"]

[project.scripts]
smartcart-catalog = "smartcart_catalog.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcart_catalog"]
