[project]
name = "smartcart-ingest"
version = "0.1.0"
description = "SmartCart ingestion: transparency files -> Postgres, with quality gates"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "lxml>=5.3,<6",
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
  "structlog>=24.4,<25",
  "il-supermarket-parser==1.0.12",
  "il-supermarket-scraper>=1.0.11,<2",
  "pydantic-settings>=2.5,<3",
  "boto3>=1.34,<2",
  "tzdata>=2024.1",
]

[project.scripts]
smartcart-ingest = "smartcart_ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcart_ingest"]
