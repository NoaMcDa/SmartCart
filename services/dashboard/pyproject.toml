[project]
name = "smartcart-dashboard"
version = "0.1.0"
description = "SmartCart internal ingestion dashboard (Streamlit, read-only)"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.50,<2",
  "psycopg[binary]>=3.2,<4",
  "pandas>=2.2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcart_dashboard"]
