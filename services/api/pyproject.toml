[project]
name = "smartcart-api"
version = "0.1.0"
description = "SmartCart thin API: parse-list, search, compare, optimize"
requires-python = ">=3.12"
dependencies = [
  "smartcart-ingest",
  "smartcart-catalog",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "structlog>=24.4,<25",
  "httpx>=0.27",
  "psycopg-pool>=3.2,<4",
  "pyjwt>=2.9,<3",
  "typer>=0.12,<1",
]

[project.scripts]
smartcart-api = "smartcart_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartcart_api"]
