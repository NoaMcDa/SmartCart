name: Beta report

# Issue #40. Runs `smartcart-catalog beta-report` against the production database and writes the
# Markdown to the job summary and the log: the three metrics against the proposed thresholds, then
# the same by segment with sample sizes (docs/beta-plan.md "Running the beta"). Read-only: it only
# reads `events` and the beta tables.
#
# Needs the repository secret SUPABASE_DB_URL (the same one Provision check uses) and the migrations
# applied to that database, including 20261011100700_beta.sql (Provision check with apply_migrations).
# Without the secret it says so and exits 0, so it is safe to merge before the database exists.
# Weekly, Monday morning Israel time, for the weekly review loop (docs/beta-plan.md section 6).

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Start of the window, YYYY-MM-DD (empty: all events)"
        required: false
        default: ""
        type: string
  schedule:
    # Mondays 05:43 UTC (08:43 Israel summer time, 07:43 winter).
    - cron: "43 5 * * 1"

concurrency:
  group: beta-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: beta-report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SINCE: ${{ inputs.since || '' }}
    steps:
      - name: Check the secret
        id: gate
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            msg="set SUPABASE_DB_URL to run the beta report"
            echo "$msg"
            echo "## Beta report" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Set up uv and Python 3.12
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: uv sync

      - name: beta-report
        if: steps.gate.outputs.run == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          args=()
          if [ -n "$SINCE" ]; then
            if ! printf '%s' "$SINCE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "since must be YYYY-MM-DD, got: $SINCE" >&2
              exit 1
            fi
            args+=(--since "$SINCE")
          fi
          uv run --no-sync smartcart-catalog beta-report --out beta-report.md "${args[@]}"
          cat beta-report.md
          cat beta-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: beta-report
          path: beta-report.md
          retention-days: 90
          if-no-files-found: ignore
