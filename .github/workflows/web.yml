name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/ux-design.md"
      - ".github/workflows/web.yml"
  push:
    paths:
      - "apps/web/**"
      - "docs/ux-design.md"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: lint, typecheck, unit, build, e2e, lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint + stylelint RTL guard)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API types are up to date with openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/types.ts

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Lighthouse CI (accessibility, best practices, SEO)
        run: |
          export CHROME_PATH="$(node -e "import('@playwright/test').then(m => console.log(m.chromium.executablePath()))")"
          npm run lhci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/.lighthouseci
          retention-days: 7
          if-no-files-found: ignore
