name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "docs/ux-design.md"
      - ".github/workflows/web.yml"
  push:
    paths:
      - "apps/web/**"
      - "docs/ux-design.md"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: lint, typecheck, unit, build, e2e, lighthouse
    # ubuntu-latest still resolves to Ubuntu 24.04 and moves to 26.04 in November 2026. Playwright 1.61
    # and newer ship Chromium for 26.04 (1.56.1 did not: "Playwright does not support chromium on
    # ubuntu26.04-x64"); with 1.64.1 this job was run once on `ubuntu-26.04` and passed (2026-10-21).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint + stylelint RTL guard)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API types are up to date with openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/types.ts

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Lighthouse CI (accessibility, best practices, SEO)
        run: |
          export CHROME_PATH="$(node -e "import('@playwright/test').then(m => console.log(m.chromium.executablePath()))")"
          npm run lhci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/.lighthouseci
          retention-days: 7
          if-no-files-found: ignore

  # Issue #26 (accessibility, Israeli standard 5568 = WCAG 2.0 AA) and #35 (Lighthouse on the
  # static SEO pages). Separate from the job above so a slow axe run never hides a lint or unit
  # failure and the other way round.
  a11y:
    name: accessibility (axe, keyboard, reflow) and SEO pages
    # ubuntu-latest still resolves to Ubuntu 24.04 and moves to 26.04 in November 2026. Playwright 1.61
    # and newer ship Chromium for 26.04 (1.56.1 did not: "Playwright does not support chromium on
    # ubuntu26.04-x64"); with 1.64.1 this job was run once on `ubuntu-26.04` and passed (2026-10-21).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Accessibility tests (axe on every route, 390 and 1280 px, both themes)
        run: npm run a11y

      - name: Lighthouse CI on the SEO pages (accessibility, best practices, SEO)
        run: |
          export CHROME_PATH="$(node -e "import('@playwright/test').then(m => console.log(m.chromium.executablePath()))")"
          npx -y @lhci/cli@0.15.1 autorun --config=lighthouserc.seo.json

      - name: Upload accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: |
            apps/web/playwright-report-a11y
            apps/web/.lighthouseci-seo
          retention-days: 7
          if-no-files-found: ignore
