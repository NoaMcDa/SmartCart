name: Dependency upgrade

# Weekly check that the newest versions inside our constraints still pass everything.
#
#   lock    uv lock --upgrade, then the list of Python packages that moved
#   python  the lint and the whole Python suite (3.12 and 3.13) against the upgraded lock, on the
#           same Postgres image as ci.yml, plus the generated-API-client check (3.12)
#   web     npm update inside package.json ranges, then lint, typecheck and unit tests
#   push    only when everything passed and a lock file changed: pushes the new lock files to a
#           branch deps/upgrade-<YYYYMMDD>. No pull request is opened; review the branch and
#           merge it (or cherry-pick the lock) when you want the upgrade.
#
# When something fails, the job log and the summary list which packages moved, so the culprit is
# in the output. Nothing is pushed on a failure. Manual runs can set dry_run to run the push job
# without creating the branch (git push --dry-run). docs/dev-setup.md describes the upgrade flow.
#
# The versions in apps/web/package.json are exact pins, so `npm update` moves only transitive
# dependencies; `npm outdated` in the web job lists the direct ones that are behind.

on:
  push:
    branches: [more2/ci] # TEMP: verification run, removed in the next commit
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the push job but do not create the branch (git push --dry-run)"
        required: false
        default: false
        type: boolean
  schedule:
    # Mondays at 04:41 UTC, before the working week in Israel (07:41 summer time, 06:41 winter).
    - cron: "41 4 * * 1"

concurrency:
  group: deps-upgrade-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lock:
    name: uv lock --upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      sha: ${{ steps.diff.outputs.sha }}
    steps:
      # Scheduled runs use the default branch, which may hold only docs and workflow copies; the
      # code lives on main, so a scheduled run checks main out. Manual runs use the chosen ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Upgrade the lock
        run: uv lock --upgrade

      - name: Which packages moved
        id: diff
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Python package moved." | tee uv-changes.md
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY' | tee uv-changes.md
          import subprocess, tomllib

          def versions(text):
              out = {}
              for pkg in tomllib.loads(text).get("package", []):
                  out.setdefault(pkg["name"], set()).add(pkg.get("version", "?"))
              return out

          old = versions(subprocess.run(["git", "show", "HEAD:uv.lock"], capture_output=True, text=True, check=True).stdout)
          new = versions(open("uv.lock", encoding="utf-8").read())
          lines = []
          for name in sorted(set(old) | set(new)):
              a, b = old.get(name), new.get(name)
              if a == b:
                  continue
              fmt = lambda v: ", ".join(sorted(v)) if v else "(absent)"
              lines.append(f"- {name}: {fmt(a)} -> {fmt(b)}")
          print(f"Python packages moved by uv lock --upgrade ({len(lines)}):")
          print()
          print("\n".join(lines))
          PY
            git diff --stat -- uv.lock
          fi
          { echo "## Python lock"; echo; cat uv-changes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the upgraded lock
        uses: actions/upload-artifact@v7
        with:
          name: uv-lock
          path: |
            uv.lock
            uv-changes.md
          retention-days: 14

  python:
    name: ruff + pytest (Python ${{ matrix.python-version }}, upgraded lock)
    needs: lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      # Same image and tag as ci.yml.
      postgres:
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SMARTCART_REQUIRE_EXTENSIONS: "1"

    steps:
      # The commit the lock job resolved, so a push to main in between cannot mix two states.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.lock.outputs.sha }}

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Take the upgraded lock
        uses: actions/download-artifact@v8
        with:
          name: uv-lock
          path: ${{ runner.temp }}/uv-lock

      - name: Install the upgraded lock
        run: |
          cp "$RUNNER_TEMP/uv-lock/uv.lock" uv.lock
          cat "$RUNNER_TEMP/uv-lock/uv-changes.md"
          uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Generated API client is current
        if: matrix.python-version == '3.12'
        run: |
          bash services/api/scripts/gen_ts_client.sh
          git diff --exit-code -- apps/web/src/api/openapi.json apps/web/src/api/types.ts

      - name: What moved (the suspects)
        if: failure()
        run: |
          echo "::error title=The upgraded Python lock fails::see the packages listed in this step and in the lock job summary"
          cat "$RUNNER_TEMP/uv-lock/uv-changes.md"
          git diff --stat

  web:
    name: npm update, lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || '' }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install the committed lock
        run: npm ci

      - name: Direct dependencies that are behind (information only)
        run: npm outdated || true

      # npm 10 (the one Node 22 ships, and the one web.yml uses) crashes in `npm update` on this
      # tree ("Cannot read properties of null (reading 'edgesOut')" in arborist's #loadPeerSet),
      # so the update runs with npm 11. npm 11 resolves the optional peer `msw` of @vitest/mocker
      # differently, and npm 10's `npm ci` then rejects its lock as out of sync. So npm 10
      # rewrites the lock (`install --package-lock-only` keeps the updated versions) and the
      # `npm ci` below proves the result installs with the npm that CI uses.
      - name: Update inside the package.json ranges (npm 11)
        run: npx --yes npm@11 update --no-audit --no-fund

      - name: Normalize the lock with the npm that CI uses
        run: npm install --package-lock-only --no-audit --no-fund

      - name: The new lock installs with that npm (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Which packages moved
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No npm package moved." | tee "$RUNNER_TEMP/npm-changes.md"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY' | tee "$RUNNER_TEMP/npm-changes.md"
          import json, subprocess

          def versions(text):
              out = {}
              for path, meta in json.loads(text).get("packages", {}).items():
                  if path and "version" in meta:
                      out.setdefault(path.rsplit("node_modules/", 1)[-1], set()).add(meta["version"])
              return out

          old = versions(subprocess.run(["git", "show", "HEAD:apps/web/package-lock.json"], capture_output=True, text=True, check=True).stdout)
          new = versions(open("package-lock.json", encoding="utf-8").read())
          lines = []
          for name in sorted(set(old) | set(new)):
              a, b = old.get(name), new.get(name)
              if a == b:
                  continue
              fmt = lambda v: ", ".join(sorted(v)) if v else "(absent)"
              lines.append(f"- {name}: {fmt(a)} -> {fmt(b)}")
          print(f"npm packages moved by npm update ({len(lines)}):")
          print()
          print("\n".join(lines))
          PY
            git diff --stat -- package-lock.json
          fi
          { echo "## npm lock"; echo; cat "$RUNNER_TEMP/npm-changes.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the updated lock
        run: |
          mkdir -p "$RUNNER_TEMP/npm-out"
          cp package-lock.json "$RUNNER_TEMP/npm-out/package-lock.json"
          cp "$RUNNER_TEMP/npm-changes.md" "$RUNNER_TEMP/npm-out/npm-changes.md"

      - name: Keep the updated lock
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: ${{ runner.temp }}/npm-out
          retention-days: 14

      - name: Lint (ESLint + stylelint RTL guard)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: What moved (the suspects)
        if: failure()
        run: |
          echo "::error title=The updated npm lock fails::see the packages listed in this step"
          cat "$RUNNER_TEMP/npm-changes.md" || true
          git diff --stat

  push:
    name: push the lock files to deps/upgrade-<date>
    needs: [lock, python, web]
    if: needs.lock.outputs.changed == 'true' || needs.web.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      LOCK_CHANGED: ${{ needs.lock.outputs.changed }}
      WEB_CHANGED: ${{ needs.web.outputs.changed }}
      DRY_RUN: ${{ inputs.dry_run || github.event_name == 'push' }} # TEMP: push trigger never creates a branch
    steps:
      # The commit the lock job upgraded (main on a scheduled run), not a branch tip that may
      # have moved while the suites ran.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.lock.outputs.sha }}

      - name: Take the upgraded Python lock
        if: needs.lock.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: uv-lock
          path: ${{ runner.temp }}/uv-lock

      - name: Take the updated npm lock
        if: needs.web.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package-lock
          path: ${{ runner.temp }}/package-lock

      # Only the two lock files are copied; nothing in the artifacts is executed.
      - name: Commit and push the branch
        run: |
          body="$RUNNER_TEMP/message.txt"
          {
            echo "Upgrade dependencies within their constraints"
            echo
            echo "Everything passed on these locks: ruff, pytest on Python 3.12 and 3.13, the generated API client, and for the web app lint, typecheck and unit tests."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$body"
          if [ "$LOCK_CHANGED" = "true" ]; then
            cp "$RUNNER_TEMP/uv-lock/uv.lock" uv.lock
            { echo; cat "$RUNNER_TEMP/uv-lock/uv-changes.md"; } >> "$body"
          fi
          if [ "$WEB_CHANGED" = "true" ]; then
            cp "$RUNNER_TEMP/package-lock/package-lock.json" apps/web/package-lock.json
            { echo; cat "$RUNNER_TEMP/package-lock/npm-changes.md"; } >> "$body"
          fi
          git status --short

          branch="deps/upgrade-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            branch="$branch-$GITHUB_RUN_ID"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- uv.lock apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -q -F "$body"
          dry=()
          title="Branch pushed"
          if [ "$DRY_RUN" = "true" ]; then dry=(--dry-run); title="Branch NOT created (dry run)"; fi
          git push "${dry[@]}" origin "HEAD:refs/heads/$branch"
          {
            echo "## $title"
            echo
            echo "Branch \`$branch\` ($(git rev-parse --short HEAD)); no pull request was opened."
            echo
            git show --stat --format= HEAD
          } | tee -a "$GITHUB_STEP_SUMMARY"
