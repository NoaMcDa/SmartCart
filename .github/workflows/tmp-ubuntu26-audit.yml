name: TEMP Ubuntu 26 audit

# Temporary, on branch more2/ci only; deleted before the work is finished.

on:
  push:
    branches: [more2/ci]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Image
        run: |
          echo "AUDIT os: $(grep PRETTY_NAME /etc/os-release)"
          echo "AUDIT image: $ImageVersion"
          echo "AUDIT python3: $(python3 --version)"
          echo "AUDIT docker: $(docker version --format '{{.Client.Version}} / {{.Server.Version}}')"
          docker run --rm alpine:3.20 echo "AUDIT docker run ok"
          echo "AUDIT psql: $(command -v psql || echo none preinstalled)"
          pg_isready -h localhost -U postgres | sed 's/^/AUDIT /'

      - name: apt packages of ocr-eval.yml
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-heb fonts-noto-core
          tesseract --version 2>&1 | head -1 | sed 's/^/AUDIT /'
          tesseract --list-langs 2>&1 | tr '\n' ' ' | sed 's/^/AUDIT /'
          echo
          fc-list | grep -i "NotoSansHebrew" | head -1 | sed 's/^/AUDIT /'

  playwright:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Playwright install --with-deps (version pinned in apps/web/package.json)
        working-directory: apps/web
        run: |
          npm ci
          npx playwright --version | sed 's/^/AUDIT /'
          npx playwright install --with-deps chromium 2>&1 | sed 's/^/AUDIT /'
