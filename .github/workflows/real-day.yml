name: Real day

# One real day through the whole pipeline, on a GitHub-hosted runner (issues #13, #44, #47, #60,
# preparation). The optimizer, the nightly precompute and the basket index had only run on
# synthetic data. Here: the portal probe's own download of one Stores and one PriceFull file per
# chain, plus the PriceFull and PromoFull files of the stores nearest to a few city centres
# (through the same pinned upstream scraper, never a chain's online store), every file through the
# real Scheduler path (adapters, quality gates, loader, store coordinates from data/geo), the
# catalog commands on the real items, the effective-price precompute, /compare and /optimize
# (heuristic and MILP) for hand-made Hebrew baskets at a few real locations, and the basket index.
# Every stage is timed. It is a measurement: a stage that fails is reported as a finding and the
# job stays green; read the job summary. See docs/real-day-dry-run.md.
#
# With `seo` (always on a push run) the loaded real prices are also exported as the static SEO data and
# the basket index (smartcart-catalog export-seo, basket-index; a draft, never published), the web app is
# built from that export with a placeholder origin and the SEO checks run against it: offline
# structured-data validation, the SEO unit tests, a crawl of every generated page and a phone-width
# browser spec. The export is a workflow artifact, never committed (docs/seo.md, "SEO on real prices").
#
# The runner is not an Israeli IP, so some portals may not answer; that is part of the measurement.
# Run it after about 08:00 Israel time (the laibcatalog listing is empty before that, D13).

on:
  # Temporary, to run the workflow from its branch (removed in the final commit).
  push:
    branches: [phase/seo-real]
  workflow_dispatch:
    inputs:
      chains:
        description: "Chain slugs, space separated (empty: every chain with an adapter)"
        required: false
        default: ""
        type: string
      timeout:
        description: "Seconds allowed per portal download"
        required: false
        default: 240
        type: number
      anchors:
        description: "City centres whose nearest stores are downloaded for the optimizer (0 = none)"
        required: false
        default: 3
        type: number
      per_chain:
        description: "Stores per chain per city centre"
        required: false
        default: 2
        type: number
      max_files:
        description: "Cap on the extra PriceFull files"
        required: false
        default: 40
        type: number
      with_promos:
        description: "Also download PromoFull files of those stores"
        required: false
        default: true
        type: boolean
      stress:
        description: "Also run the stress variant (unreviewed mappings counted as accepted; performance only)"
        required: false
        default: true
        type: boolean
      seo:
        description: "Also export the SEO pages and basket index on the real prices and build and check the web app from them (a preview, never deployed)"
        required: false
        default: false
        type: boolean
      commit_report:
        description: "Push the report and its JSON to a new branch real-day/report-<run id> (no raw files)"
        required: false
        default: false
        type: boolean

concurrency:
  group: real-day-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  real-day:
    name: download, load, match, precompute, optimize
    runs-on: ubuntu-latest
    timeout-minutes: 180

    services:
      # Same image and tag as ci.yml (Postgres 17 with PostGIS, pgvector and pg_trgm).
      postgres:
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PYTHONUNBUFFERED: "1"
      CHAINS: ${{ github.event_name == 'push' && 'king_store mega osherad ramilevy shufersal tivtaam yohananof' || inputs.chains || '' }}
      ANCHORS: ${{ inputs.anchors || 3 }}
      PER_CHAIN: ${{ inputs.per_chain || 2 }}
      MAX_FILES: ${{ inputs.max_files || 40 }}
      TIMEOUT: ${{ inputs.timeout || 240 }}
      WITH_PROMOS: ${{ github.event_name == 'push' && 'true' || inputs.with_promos }}
      STRESS: ${{ github.event_name == 'push' && 'true' || inputs.stress }}
      SEO: ${{ github.event_name == 'push' && 'true' || inputs.seo }}

    steps:
      # The code lives on the chosen ref; no schedule, so no default-branch fallback is needed.
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install
        run: uv sync --locked

      - name: Runner location
        run: |
          {
            echo "## Runner"
            echo
            echo "Public IP country (ipinfo.io): $(curl -fsS --max-time 15 https://ipinfo.io/country || echo unknown). $(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2}') MB memory."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Downloads live outside the checkout ($RUNNER_TEMP); nothing runs from there.
      - name: The real day
        run: |
          mkdir -p "$RUNNER_TEMP/real-day" out
          args=()
          for slug in $CHAINS; do args+=(--chain "$slug"); done
          if [ "$WITH_PROMOS" != "true" ]; then args+=(--no-promos); fi
          if [ "$STRESS" != "true" ]; then args+=(--no-stress); fi
          if [ "$SEO" = "true" ]; then args+=(--seo-out "$RUNNER_TEMP/seo"); fi
          uv run --no-sync python scripts/unblock/real_day.py run \
            --work "$RUNNER_TEMP/real-day" \
            --timeout "$TIMEOUT" --anchors "$ANCHORS" --per-chain "$PER_CHAIN" --max-files "$MAX_FILES" \
            --out out/real-day.md --json-out out/real-day.json "${args[@]}"

      # The web side of the SEO preview. NEXT_PUBLIC_SITE_URL is a placeholder under .invalid (the
      # strict site-URL guard refuses it for a deploy build) and NEXT_PUBLIC_INDEX_UNPRICED is 0, so
      # unpriced product pages are noindex as docs/seo.md recommends until prices are loaded.
      - uses: actions/setup-node@v7
        if: always() && env.SEO == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: SEO preview, install the web app
        if: always() && env.SEO == 'true'
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: SEO preview, build and check the pages
        if: always() && env.SEO == 'true'
        run: |
          mkdir -p out
          for variant in production stress; do
            if [ -f "$RUNNER_TEMP/seo/$variant/products.json" ]; then
              uv run --no-sync python scripts/unblock/seo_preview.py web \
                --export "$RUNNER_TEMP/seo/$variant" --variant "$variant" --out out --e2e || echo "::warning::SEO preview $variant failed to run"
            else
              echo "::warning::no SEO export for $variant"
            fi
          done
          for f in out/seo-web-*.md; do [ -f "$f" ] && cat "$f"; done || true

      - name: Report (job summary)
        if: always()
        run: |
          if [ -f out/real-day.md ]; then
            head -c 800000 out/real-day.md >> "$GITHUB_STEP_SUMMARY"
            for f in out/seo-web-*.md; do
              if [ -f "$f" ]; then { echo; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"; fi
            done
          else
            echo "no report was written" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-day-report
          path: out
          retention-days: 30
          if-no-files-found: ignore

      # The export is a preview of real prices: kept 7 days, as an artifact only, never in git.
      - name: Upload the SEO export
        if: always() && env.SEO == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seo-export-preview
          path: ${{ runner.temp }}/seo
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the downloaded files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-day-files
          path: |
            ${{ runner.temp }}/real-day/probe/files
            ${{ runner.temp }}/real-day/probe/probe.json
            ${{ runner.temp }}/real-day/extra
          retention-days: 7
          if-no-files-found: ignore

  # Only the report (Markdown and JSON: counts, timings, store and chain names), never the raw
  # files. No pull request is opened. A push with the workflow token starts no workflow.
  commit-report:
    name: commit the report to real-day/report-<run id>
    needs: real-day
    if: always() && (inputs.commit_report || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the report
        uses: actions/download-artifact@v4
        with:
          name: real-day-report
          path: ${{ runner.temp }}/report

      - name: Commit and push the branch
        run: |
          branch="real-day/report-$GITHUB_RUN_ID"
          mkdir -p real-day-report
          cp "$RUNNER_TEMP/report/real-day.md" "$RUNNER_TEMP/report/real-day.json" real-day-report/
          # The SEO preview's results (counts, findings, check outcomes); never its export.
          for f in "$RUNNER_TEMP"/report/seo-web-*.md "$RUNNER_TEMP"/report/seo-web-*.json "$RUNNER_TEMP"/report/vitest-*.json; do
            if [ -f "$f" ]; then cp "$f" real-day-report/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- real-day-report
          git commit -q -m "Real day report of run $GITHUB_RUN_ID" \
            -m "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "HEAD:refs/heads/$branch"
          echo "Report pushed to branch \`$branch\` (no pull request opened)." >> "$GITHUB_STEP_SUMMARY"
