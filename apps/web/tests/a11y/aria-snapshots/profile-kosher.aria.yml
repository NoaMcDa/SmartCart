- text: "כשר לפסח סינון נפרד: רק מוצר ששמו מציין ״כשר לפסח״ נחשב מתאים, ומוצר שאומר שאינו כשר לפסח לא יוצג."
- switch "כשר לפסח" [checked]
- text: רק מוצרים שהכשרות שלהם מצוינת בשם בלי האפשרות הזו, מוצר ששמו לא מציין כשרות יוצג עם התווית ״כשרות לא ידועה — בדקו על האריזה״. איתה הוא לא יוצג בכלל, וחנות שאין בה מוצר מתאים תציג אותו כחסר.
- switch "רק מוצרים שהכשרות שלהם מצוינת בשם" [checked]
- paragraph: קבצי הרשתות לא כוללים כשרות. אנחנו קוראים רק מילים מפורשות בשם המוצר (למשל מהדרין או בד״ץ), ולא מניחים כשרות לפי יצרן או מותג. מוצר ששמו מציין כשרות אחרת מזו שבחרת לא יוצג. אין בזה תחליף לבדיקת האריזה.
