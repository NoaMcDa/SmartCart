- region "ברירת מחדל למותג מדויק?":
  - heading "ברירת מחדל למותג מדויק?" [level=2]
  - paragraph: בקטגוריה “חלב” שמרת מותג מדויק או דחית תחליף 3 פעמים ב-90 הימים האחרונים. להגדיר מותג מדויק כברירת המחדל שלה?
  - paragraph: זו רק הצעה. השינוי חל על פריטים חדשים מהקטגוריה הזו, לא על מה שכבר ברשימה, ואפשר לשנות אותו בכל רגע בפרופיל.
