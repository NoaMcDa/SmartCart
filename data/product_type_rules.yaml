# Product type rules (issue #15). Per product type, which attributes must be equal at the
# "any brand" level (critical_keys) and which may differ at "close substitute" (soft_keys).
# The product type itself is always critical: soy and almond drink are different types. Plant
# drinks also list `base` (soy, almond, oat) as a critical key (issue #102): a drink whose type
# was guessed wrong, or a rice or coconut drink with no type of its own, is still vetoed by its
# base. Dairy types exclude the plant words so a soy yogurt is never typed as a dairy yogurt.
# Keys are Attributes fields (services/catalog/smartcart_catalog/models.py).
#
# keywords / exclude / implied are read by the rule extractor only (extract/rule.py) and are not
# stored in Postgres: a name containing a keyword and none of the excludes gets this
# product_type (the longest keyword wins); `implied` attributes are filled when the type
# itself implies them (milk without "עמיד" is fresh). They are an initial list (estimate) to be
# tuned on loaded data.
version: 1
rules:
- product_type: milk
  critical_keys: [fat_pct, state]
  soft_keys: [pack_size, brand]
  keywords: [חלב]
  exclude: [שוקו, אבקת, עמיד, לקטוז, סויה, שקדים, שיבולת, קוקוס, אורז, שוקולד, ממרח, עוגי, ופל, מרכך, סבון, קרם, בטעם, ריבת, קפה]
  implied: {state: fresh}
- product_type: milk_long_life
  critical_keys: [fat_pct]
  soft_keys: [pack_size, brand]
  keywords: [חלב עמיד, עמיד]
  exclude: [שוקו, סויה, שקדים, שיבולת, קוקוס, אורז]
- product_type: milk_lactose_free
  critical_keys: [fat_pct]
  soft_keys: [pack_size, brand]
  keywords: [ללא לקטוז, דל לקטוז]
