# SYNTHETIC Arabic query set for the Arabic list entry and search (issue #73). It is NOT evidence
# of real precision: it was written by the same drafter as the machine-drafted names in
# data/canonicals.yaml (names_ar), has no native-speaker review, and every line is invented. It
# exists to catch regressions in the matching rules and to give the first number to beat once real
# Arabic list lines (with consent) are labeled. See docs/matching.md, "Arabic queries".
#
# Each entry is one list line as a shopper might type it:
#   q:      the line, sent to POST /parse-list as is (quantities, dialect spellings, typos,
#           Arabic-Indic digits, article ال and conjunction و included)
#   expect: the canonical slug the line must resolve to, or `none`: the line must NOT be served
#           (not in the catalog, or too general to pick one canonical such as "حليب" without a fat
#           percentage, or it states an attribute no canonical has such as "حليب 2%")
#   flex:   the flexibility level the shopper set (default_flex when omitted). `exact` lines carry
#           a brand ("حليب تنوفا 3%"), `close` lines carry soft descriptors (size, "كبير",
#           "اقتصادي") that the canonical does not state; resolution must ignore both.
#
# Served = the row is not `not_found` and does not `needs_confirmation` (confidence >= 0.75).
# Precision = served and expect == the canonical / served. Recall = served and correct / lines whose
# expect is a slug. A line with `expect: none` that is served counts as a wrong answer.
version: 1
synthetic: true
default_flex: any_brand
queries:
