# SmartCart product taxonomy v1 (issue #10). Source of truth; seeded by `smartcart-catalog seed`.
#
# One entry per node. The id is a stable dotted slug: the parent is the id without its last
# segment, and the level is the number of segments (1 department, 2 category, 3 product type,
# 4 optional sub-type). Never rename or reuse an id: canonical_products.taxonomy_id points at it.
# To retire a node, keep it and stop pointing canonicals at it. Order in this file is `sort`.
#
# Level 1 is the 19 departments. The research says the taxonomy starts from Hazol's 19
# categories (research section 4.3) but does not list them; the list below is our own Hebrew
# supermarket department list of 19 (a design choice, not copied from Hazol). How to add a node
# and who approves: docs/catalog.md.
