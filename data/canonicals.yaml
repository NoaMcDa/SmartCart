# MVP canonical products (issue #15). Seeded by `smartcart-catalog seed`; upserted by slug.
#
# rank: basket-frequency rank, 1 = most common. It is an ESTIMATE: a judgement from the research
# (staples, the 67-item press basket) and general knowledge of Israeli shopping, grouped into
# five tiers and ordered within a tier by hand. It is not measured. Replace it with a ranking from
# loaded data (item frequency across chains and promos) once the catalog is mapped. See
# docs/catalog.md, "Choosing the canonicals".
#
# critical_attrs must name exactly the critical_keys of the product type; two canonicals may not
# share (product_type, critical_attrs). soft_attrs are typical values (pack_size in g, ml or
# units). Values such as fat percentages describe the common Israeli SKU and still need the
# domain-aware reviewer's sign-off.
